[project]
name = "regen-consistency"
version = "0.1.0"
description = "CoT truncation and regeneration experiments"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    # Align with nvidia-smi "CUDA Version: 12.x" (e.g. 12.8): use PyTorch cu126 wheels.
    # cu118 stacks can SIGSEGV on newer drivers when mixed with other CUDA userlands.
    "vllm==0.19.1",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "torchaudio==2.10.0",
    "numpy",
    "openai",
    "transformers",
    "highspy",
    "matplotlib",
    "pandas",
    "scipy",
    "hf-transfer>=0.1.9",
    "datasets>=4.8.4",
    "antlr4-python3-runtime==4.11.1",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
